<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guesser Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css" integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h3>Guesser Game</h3>
        <p>Guess the number between 1 - 10</p>
        <p>You've 3 chances to win</p>
        <div class="form">
            <input type="text" name="" id="input-number">
            <input type="submit" value="Submit" id="submit-number">
        </div>
        <p>Attempt: <span id="attempt">3</span></p>
    </div>


    <script src="main.js"></script>
</body>
</html>
